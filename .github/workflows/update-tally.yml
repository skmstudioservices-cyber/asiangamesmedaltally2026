name: Update Medal Tally

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Wikipedia tally
        run: |
          python3 - <<'PY'
import json, re, urllib.request, datetime
url = 'https://en.wikipedia.org/w/api.php?action=parse&page=2026_Asian_Games_medal_table&prop=text&format=json'
d = json.load(urllib.request.urlopen(url, timeout=40))
t = d['parse']['text']['*']
rows = re.findall(r'<tr>(.*?)</tr>', t, re.S)
tally = []
for r in rows:
    cells = re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S)
    if len(cells) < 6: continue
    cl = [re.sub(r'<[^>]+>','',c).replace('\u00a0',' ').strip() for c in cells]
    try:
        rank = int(cl[0]); g=int(cl[2]); s=int(cl[3]); b=int(cl[4])
    except ValueError:
        continue
    nation = re.sub(r'\[.*?\]','',cl[1]).strip() or cl[1]
    try: tot=int(cl[5])
    except Exception: tot=g+s+b
    tally.append([rank,nation,g,s,b,tot])
if len(tally) < 8:
    print('too few rows, skipping commit'); raise SystemExit(0)
data = {"last_updated": datetime.datetime.now().strftime('%d %b %Y, %I:%M %p') + ' IST (auto)', "tally": tally}
open('data.json','w').write(json.dumps(data))
ih = open('index.html').read()
seed_line = 'var SEED = ' + json.dumps(data) + ';'
ih_new = re.sub(r'var SEED = \{.*?\};', lambda m: seed_line, ih, count=1)
ih_new = ih_new.replace('Data as of 26 September 2026, 8:45 AM IST', 'Data as of ' + data['last_updated'])
open('index.html','w').write(ih_new)
print('tally updated, rows:', len(tally), '| India:', [x for x in tally if 'India' in x[1]])
PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no changes"; else
            git config user.name "tally-bot"; git config user.email "actions@github.com"
            git add -A; git commit -m "data: medal tally refresh [skip verify]" && git push
          fi
